name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The glass surfaces need the macOS 26 SDK; the app itself still runs on macOS 14.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          # SwiftTerm ships a Metal shader; Xcode 26+ downloads the Metal toolchain separately.
          xcodebuild -downloadComponent MetalToolchain || true
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      # The website's 更新记录 is generated from CHANGELOG.md; a changelog edit without regenerating fails here.
      - name: Website changelog
        run: python3 scripts/site-changelog.py --check
      - name: Build
        run: swift build --product Folmi
      # The Git and core logic. The app's view tests draw real windows and read them back, which a CI runner
      # without a logged-in screen does not support reliably; run those locally with scripts/test.sh.
      - name: Core tests
        run: TEST_TIMEOUT=1200 scripts/test.sh --filter FolmiCoreTests
